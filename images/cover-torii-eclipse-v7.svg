<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1026"/>
      <stop offset="55%" stop-color="#1e1b40"/>
      <stop offset="100%" stop-color="#120b1e"/>
    </linearGradient>
    <linearGradient id="torii" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9534f"/>
      <stop offset="100%" stop-color="#6e1d26"/>
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#sky)"/>
  <!-- Crescent Moon -->
  <circle cx="300" cy="230" r="95" fill="#ebd074" opacity="0.9"/>
  <circle cx="332" cy="212" r="84" fill="#141430"/>
  <!-- Misty Mountains -->
  <path d="M0 540 Q150 430 300 490 T600 460 L600 660 L0 660 Z" fill="#16112c"/>
  <path d="M0 590 Q180 520 340 565 T600 540 L600 660 L0 660 Z" fill="#0f0a1d"/>
  <!-- Torii Gate -->
  <path d="M135 295 Q300 320 465 295 L455 322 Q300 342 145 322 Z" fill="url(#torii)" stroke="#d4af37" stroke-width="1.5"/>
  <rect x="175" y="345" width="250" height="16" fill="url(#torii)"/>
  <rect x="200" y="318" width="24" height="255" fill="url(#torii)"/>
  <rect x="376" y="318" width="24" height="255" fill="url(#torii)"/>
  <!-- Floating Lanterns -->
  <g fill="#ebd074">
    <rect x="125" y="395" width="18" height="26" rx="4" opacity="0.88"/>
    <rect x="458" y="375" width="18" height="26" rx="4" opacity="0.88"/>
    <rect x="291" y="420" width="18" height="28" rx="4" opacity="0.95"/>
    <rect x="165" y="485" width="14" height="20" rx="3" opacity="0.75"/>
    <rect x="425" y="470" width="14" height="20" rx="3" opacity="0.75"/>
  </g>
  <!-- Stone Steps -->
  <g fill="#261c3d" stroke="#d4af37" stroke-opacity="0.25">
    <rect x="235" y="560" width="130" height="14"/>
    <rect x="215" y="578" width="170" height="16"/>
    <rect x="195" y="598" width="210" height="18"/>
  </g>
  <rect x="24" y="24" width="552" height="752" rx="14" fill="none" stroke="#d4af37" stroke-opacity="0.45" stroke-width="2"/>
  <text x="300" y="88" text-anchor="middle" fill="#ebd074" font-family="Georgia, serif" font-size="18" letter-spacing="5">COLLECTOR TANKOBON • VOL. 7</text>
  <text x="300" y="676" text-anchor="middle" fill="#f5efe0" font-family="Georgia, serif" font-size="30" font-weight="bold" letter-spacing="2">LANTERNS BENEATH</text>
  <text x="300" y="714" text-anchor="middle" fill="#d4af37" font-family="Georgia, serif" font-size="22" letter-spacing="3">THE CRESCENT TORII</text>
  <text x="300" y="750" text-anchor="middle" fill="#c4b7d4" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">HARUTO TAKAHASHI</text>
</svg>
